<script>
/* ============================================================
   Igotdomain Assistant — v3
   No AI API required. Keyword-matched, state-driven flow.
   State writes to localStorage.igd_state so /dashboard updates.
   ============================================================ */

const body    = document.getElementById('abody');
const inputEl = document.getElementById('ainput');
const sendBtn = document.getElementById('asend');

const STORE_KEY  = 'igd_progress';
const EMAIL_KEY  = 'igd_email';
const STATE_KEY  = 'igd_state';   // dashboard reads this

const STOP = new Set(['a','an','the','for','to','of','and','or','my','i','want','build',
  'create','make','business','startup','company','idea','app','platform','that','helps',
  'help','with','in','on','is','are','be','it','this','website','site','need','looking']);

let state = { email:'', idea:'', domain:'', step:'idea', name:'' };

/* ── localStorage helpers ── */
function loadStore(){ try{ return JSON.parse(localStorage.getItem(STORE_KEY)||'{}'); }catch(e){ return {}; } }
function loadIgdState(){
  try{ var s=JSON.parse(localStorage.getItem(STATE_KEY)); return s||null; }catch(e){ return null; }
}
function saveIgdState(s){ try{ localStorage.setItem(STATE_KEY,JSON.stringify(s)); }catch(e){} }

function defaultIgdState(name){
  return {
    name: name||'there',
    stack:{ idea:null,domain:null,website:null,email:null,banking:null,accounting:null,payments:null },
    saved:[], activity:[], websitePartial:false
  };
}

function getOrCreateIgdState(){
  var s=loadIgdState();
  if(!s) s=defaultIgdState(state.email?state.email.split('@')[0]:'there');
  return s;
}

function addToStack(category, toolName, saved){
  var s=getOrCreateIgdState();
  s.stack[category]={ tool:toolName, done:true, saved:saved||0 };
  saveIgdState(s);
}

function markIdea(ideaText){
  var s=getOrCreateIgdState();
  s.stack.idea={ tool:'Validated', done:true };
  if(ideaText) s.name = ideaText.split(' ').slice(0,3).join(' ');
  saveIgdState(s);
}

function logActivity(type, txt){
  var s=getOrCreateIgdState();
  if(!s.activity) s.activity=[];
  s.activity.unshift({ type:type, txt:txt, when:'just now' });
  if(s.activity.length>8) s.activity=s.activity.slice(0,8);
  saveIgdState(s);
}

function saveComparison(title){
  var s=getOrCreateIgdState();
  if(!s.saved) s.saved=[];
  if(!s.saved.includes(title)){ s.saved.unshift(title); if(s.saved.length>6) s.saved=s.saved.slice(0,6); }
  saveIgdState(s);
}

function saveProgress(){
  if(!state.email) return;
  try{
    var all=loadStore();
    all[state.email]={ idea:state.idea, domain:state.domain, step:state.step };
    localStorage.setItem(STORE_KEY,JSON.stringify(all));
    localStorage.setItem(EMAIL_KEY,state.email);
    var s=getOrCreateIgdState();
    s.name=state.email.split('@')[0];
    saveIgdState(s);
  }catch(e){}
}

function setStep(st){ state.step=st; saveProgress(); }
function markPurchased(){ try{ localStorage.setItem('igd_purchased','1'); }catch(e){} }

/* ── DOM helpers ── */
function scrollDown(){ body.scrollTop=body.scrollHeight; }

function ai(html, delay){
  delay = delay===undefined ? 600 : delay;
  return new Promise(function(res){
    var tp=document.createElement('div'); tp.className='msg msg-ai';
    tp.innerHTML='<div class="typing"><span></span><span></span><span></span></div>';
    body.appendChild(tp); scrollDown();
    setTimeout(function(){
      tp.remove();
      var w=document.createElement('div'); w.className='msg msg-ai';
      w.innerHTML='<div class="msg-bubble">'+html+'</div>';
      body.appendChild(w); scrollDown(); res();
    }, delay);
  });
}

function user(text){
  var w=document.createElement('div'); w.className='msg msg-user';
  w.innerHTML='<div class="msg-bubble">'+text+'</div>';
  body.appendChild(w); scrollDown();
}

function card(innerHTML){
  var c=document.createElement('div'); c.className='acard';
  c.innerHTML=innerHTML; body.appendChild(c); scrollDown(); return c;
}

function chips(options, handler){
  var wrap=document.createElement('div'); wrap.className='quick-chips';
  options.forEach(function(o){
    var b=document.createElement('button'); b.className='qchip'; b.textContent=o;
    b.onclick=function(){ handler(o,wrap); }; wrap.appendChild(b);
  });
  body.appendChild(wrap); scrollDown(); return wrap;
}

function isEmail(t){ return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(t.trim()); }
function isDomain(t){ return /\.[a-z]{2,}$/i.test(t.trim())&&!/\s/.test(t.trim()); }

function keywords(text){
  return text.toLowerCase().replace(/[^a-z0-9\s]/g,' ').split(/\s+/)
    .filter(function(w){ return w&&w.length>2&&!STOP.has(w); });
}
function capital(s){ return s.charAt(0).toUpperCase()+s.slice(1); }

/* ── Keyword intent detection for free typing ── */
function detectIntent(text){
  var t=text.toLowerCase();
  if(/(domain|url|\.com|\.io|\.ai|\.co\b|register|registrar)/.test(t)) return 'domain';
  if(/(website|builder|wix|webflow|squarespace|shopify|framer|wordpress|landing\s*page)/.test(t)) return 'website';
  if(/(bank|account|business\s*account|mercury|tide|revolut|starling|wise)/.test(t)) return 'banking';
  if(/(account(ing)?|bookkeep|wave|xero|quickbooks|freeagent|freshbooks|tax|books)/.test(t)) return 'accounting';
  if(/(payment|stripe|paddle|checkout|sell|revenue)/.test(t)) return 'payments';
  if(/(email|google\s*workspace|outlook|microsoft\s*365|branded\s*email)/.test(t)) return 'email';
  return null;
}

/* ── Domain suggestions ── */
function suggestDomains(text){
  var kw=keywords(text); var base=kw[0]||'launch'; var second=kw[1]||'';
  var root=(base+(second?capital(second):'')).slice(0,16);
  return [
    {name:base+second, ext:'.com'},
    {name:'get'+capital(base), ext:'.com'},
    {name:base+'hq', ext:'.com'},
    {name:root.toLowerCase(), ext:'.io'},
    {name:'try'+capital(base), ext:'.io'},
    {name:base+(second||'app'), ext:'.ai'}
  ].map(function(c,i){ return Object.assign({},c,{name:c.name.toLowerCase(),avail:!(i===0)}); });
}

              ['Tide','🌊','£0/mo','Pay-as-you-go','UK sole traders',false],
              ['Starling','⭐','£0/mo','Free UK transfers','UK SMEs',false]];

/* ── "What are you looking for?" quick-pick grid ── */
function showDecisionGrid(){
  var c=document.createElement('div'); c.className='acard';
  c.innerHTML='<div class="acard-title" style="margin-bottom:12px">What would you like to sort first?</div>';
  var grid=document.createElement('div'); grid.className='decision-grid';

  var decisions=[
    { ico:'🔤', title:'Find a domain name',      sub:'Check availability & prices',   fn: function(){ removeGrid(); user('Help me find a domain'); askDomainIdea(); }},
    { ico:'🌐', title:'I have a domain',          sub:'Compare registrar prices',       fn: function(){ removeGrid(); user('I already have a domain'); promptExistingDomain(); }},
    { ico:'🏗️',  title:'Build a website',         sub:'Compare website builders',       fn: function(){ removeGrid(); user('Website builder comparison'); doBuilders(); }},
    { ico:'🏦', title:'Open a bank account',      sub:'Business banking options',       fn: function(){ removeGrid(); user('Business bank account comparison'); doAccounts(); }},
    { ico:'📒', title:'Set up accounting',        sub:'Software for your books',        fn: function(){ removeGrid(); user('Accounting software comparison'); doAccounting(); }},
    { ico:'🗺️',  title:'See the full roadmap',    sub:'Walk through every step',        fn: function(){ removeGrid(); user('Show me the full founder roadmap'); runFullFlow(); }, full:true}
  ];

  function removeGrid(){ c.remove(); }

  decisions.forEach(function(d){
    var btn=document.createElement('button');
    btn.className='decision-card'+(d.full?' full':'');
    btn.innerHTML='<div class="dico">'+d.ico+'</div><div class="dtitle">'+d.title+'</div><div class="dsub">'+d.sub+'</div>';
    btn.onclick=d.fn;
    grid.appendChild(btn);
  });

  c.appendChild(grid); body.appendChild(c); scrollDown(); return c;
}

/* ── Related Founder Decisions (shown after each comparison) ── */
function showNextDecisions(exclude){
  var all=[
    { ico:'🔤', label:'Domain names',   fn: function(){ user('Domain name comparison'); askDomainIdea(); }},
    { ico:'🏗️',  label:'Website builder',fn: function(){ user('Website builder comparison'); doBuilders(); }},
    { ico:'🏦', label:'Business banking',fn: function(){ user('Business bank account'); doAccounts(); }},
    { ico:'📒', label:'Accounting',      fn: function(){ user('Accounting software'); doAccounting(); }},
  ].filter(function(d){ return d.label.toLowerCase().indexOf(exclude||'__')===-1; });

  var wrap=document.createElement('div'); wrap.className='msg msg-ai';
  var html='<div class="msg-bubble"><div class="next-decisions"><p>Related founder decisions:</p><div class="nd-grid">';
  var fns=[];
  all.forEach(function(d,i){
    html+='<button class="nd-card" data-i="'+i+'">'+d.ico+' '+d.label+' →</button>';
    fns.push(d.fn);
  });
  html+='</div></div></div>';
  wrap.innerHTML=html;
  wrap.querySelectorAll('.nd-card').forEach(function(btn){
    btn.addEventListener('click', function(){ wrap.remove(); fns[+btn.getAttribute('data-i')](); });
  });
  body.appendChild(wrap); scrollDown();
}

/* ── Step nav (skip button) — same pattern as before ── */
function stepNav(prompt, label, fn){
  var c=card('<div style="font-size:14px;color:var(--gray-600)">'+prompt+'</div>');
  var act=document.createElement('div'); act.className='acard-actions';
  var b=document.createElement('button'); b.className='next-btn'; b.textContent=label;
  b.onclick=function(){ act.remove(); user(label.replace(/ →$/,'')); fn(); };
  var skip=document.createElement('button'); skip.className='next-btn ghost'; skip.textContent='Skip this →';
  skip.onclick=function(){ act.remove(); user('Skip this'); fn(true); };
  act.appendChild(b); act.appendChild(skip); c.appendChild(act); scrollDown();
}

/* ============================================================
   FLOW STEPS
   ============================================================ */

/* ── Step 1 : Congratulate + ask idea ── */
async function start(){
  var savedEmail=''; try{ savedEmail=localStorage.getItem(EMAIL_KEY)||''; }catch(e){}
  var store=loadStore();

  /* Returning user */
  if(savedEmail && store[savedEmail]){
    state.email=savedEmail; state.idea=store[savedEmail].idea||''; state.domain=store[savedEmail].domain||'';
    await ai('Welcome back! 👋 Great to see you again.');
    await ai('I\'ve still got your progress saved'+(state.idea?' — you\'re building <strong>'+state.idea+'</strong>':'')+'.');
    var wrap=document.createElement('div'); wrap.className='quick-chips';
    var cont=document.createElement('button'); cont.className='qchip'; cont.textContent='▶ Continue where I left off';
    cont.onclick=function(){ wrap.remove(); user('Continue where I left off'); resume(); };
    var fresh=document.createElement('button'); fresh.className='qchip'; fresh.textContent='↻ Start fresh';
    fresh.onclick=function(){ wrap.remove(); user('Start fresh'); state.idea='';state.domain='';state.step='idea'; congratulate(); };
    body.appendChild(wrap); scrollDown();
    return;
  }

  congratulate();
}

async function congratulate(){
  await ai('🎉 Congratulations on taking your first step to becoming a founder!', 800);
  await ai('Deciding to build something of your own takes real courage — and you\'ve already done the hardest part by starting. Let\'s make everything from here as easy as possible.', 900);
  askIdea();
}

async function askIdea(){
  setStep('idea');
  await ai('So — <strong>what\'s your business idea?</strong><br>Even a rough sentence or just a few words is fine. I only need enough to point you in the right direction.');
  chips(
    ['SaaS for project management','Coffee subscription box','Freelance design agency','Online fitness coaching'],
    function(val,wrap){ wrap.remove(); handleInput(val); }
  );
}

/* ── Step 2 : After idea → ask what they need ── */
async function afterIdeaStep(){
  markIdea(state.idea);
  logActivity('compared', 'Shared idea: '+state.idea.slice(0,40));

  var short = state.idea.length > 40 ? state.idea.slice(0,40)+'…' : state.idea;
  await ai('Love it — <strong>'+short+'</strong> sounds like a great direction. 💡');
  await ai('Do you have a <strong>business name or domain</strong> in mind? Or jump straight to what you need most:');
  showDecisionGrid();
}

/* ── Domain flows ── */
async function askDomainIdea(){
  setStep('domains');
  await ai('What name are you thinking of — or describe your business and I\'ll suggest some options.');
}

async function promptExistingDomain(){
  setStep('domains');
  await ai('No problem — type the domain and I\'ll compare prices across registrars for you.');
}

async function showDomainSuggestions(text){
  setStep('domains');
  var sugg=suggestDomains(text);
  var c=card('<div class="acard-title">🌐 Domain suggestions</div><div class="acard-note">Pick one to compare prices across registrars</div>');
  var list=document.createElement('div'); list.className='domain-suggest';
  sugg.forEach(function(s){
    var row=document.createElement('div'); row.className='dsug';
    row.innerHTML='<span class="dn">'+s.name+'<span class="domain-ext">'+s.ext+'</span></span>'+
      (s.avail?'<span class="pill pill-yes">Available</span>':'<span class="pill pill-no">Taken</span>');
    if(s.avail){ row.onclick=function(){ pickDomain(s.name+s.ext,c); }; }
    else{ row.style.opacity='0.55'; row.style.cursor='not-allowed'; }
    list.appendChild(row);
  });
  c.appendChild(list);
  var act=document.createElement('div'); act.className='acard-actions';
  var skip=document.createElement('button'); skip.className='next-btn ghost'; skip.textContent='I already have a domain — skip →';
  skip.onclick=function(){ user('I already have a domain'); doBuilders(); };
  act.appendChild(skip); c.appendChild(act); scrollDown();
}

async function pickDomain(domain, cardEl){
  state.domain=domain;
  cardEl.querySelectorAll('.dsug').forEach(function(d){ d.style.pointerEvents='none'; });
  user('Let\'s go with '+domain);
  logActivity('compared','Compared domain prices for '+domain);
  saveComparison('Domain prices: '+domain);
  await ai('Great choice! Here\'s how <strong>'+domain+'</strong> is priced across registrars 👇');
  card(domainPriceTable(domain));
  await ai('Cloudflare and Porkbun never mark up renewals — they\'re the safest long-term picks.');
  addToStack('domain', domain.split('.')[0]+' ('+domain.split('.').pop()+')', 55);
  setStep('builders');
  stepNav('Next up — where will you build your website?','Compare website builders →',doBuilders);
  showNextDecisions('domain');
}

async function runDomainPrices(){
  logActivity('compared','Compared domain prices for '+state.domain);
  saveComparison('Domain prices: '+state.domain);
  card(domainPriceTable(state.domain||'yourbusiness.com'));
  await ai('Cheapest isn\'t always best — Cloudflare and Porkbun never mark up renewals, while some registrars hike year two.');
  addToStack('domain', (state.domain||'yourdomain.com'), 55);
  setStep('builders');
  stepNav('Next, let\'s pick where you\'ll build your site.','Compare website builders →',doBuilders);
  showNextDecisions('domain');
}

/* ── Website builders ── */
async function doBuilders(skip){
  setStep('builders');
  if(!skip){
    await ai('Here\'s how the leading website builders compare 👇');
    card(buildersTable());
    logActivity('compared','Compared website builders');
    saveComparison('Website builders');
    await ai('Selling products? Shopify is the safe default. SaaS or portfolio? Framer or Webflow give you more design control for less.');
  }
  setStep('accounts');
  stepNav('Now the money side — where will you hold your business funds?','Compare business accounts →',doAccounts);
  showNextDecisions('website');
}

/* ── Business accounts ── */
async function doAccounts(skip){
  setStep('accounts');
  if(!skip){
    await ai('A dedicated business account keeps your finances clean from day one 👇');
    card(accountsTable());
    logActivity('compared','Compared business accounts');
    saveComparison('Business bank accounts');
    await ai('Tip: open this before your first sale so every transaction is cleanly separated for tax time.');
  }
  setStep('accounting');
  stepNav('Last piece — keeping your books in order.','Compare accounting software →',doAccounting);
  showNextDecisions('bank');
}

/* ── Accounting ── */
async function doAccounting(skip){
  setStep('accounting');
  if(!skip){
    await ai('And finally, accounting software so tax season is painless 👇');
    card(accountingTable());
    logActivity('compared','Compared accounting software');
    saveComparison('Accounting software');
    await ai('Wave is free and perfect to start. Graduate to Xero or QuickBooks as you grow.');
  }
  finish();
}

/* ── Full roadmap (walk through everything) ── */
async function runFullFlow(){
  setStep('domains');
  if(state.domain){ return runDomainPrices(); }
  await ai('Let\'s walk through the full founder roadmap — domain, website, banking, and accounting. 🗺️');
  if(state.idea){ await showDomainSuggestions(state.idea); }
  else { await ai('First, what\'s your business idea or name?'); }
}

/* ── Finish ── */
async function finish(){
  setStep('done');
  await ai('🎉 That\'s your core launch stack: <strong>domain → website → bank → books</strong>. Your dashboard is tracking everything.');
  var c=card('<div class="acard-title">🚀 You\'re ready to launch</div><div class="acard-note">Your startup progress has been saved to your dashboard</div>');
  var act=document.createElement('div'); act.className='acard-actions';
  act.innerHTML='<a class="next-btn" href="/dashboard">Open my dashboard →</a><a class="next-btn ghost" href="/how-it-works">See full roadmap</a>';
  c.appendChild(act); scrollDown();
}

/* ── Resume returning user ── */
async function resume(){
  var s=state.step;
  if(s==='builders'){ await ai('Picking up at website builders 👇'); return doBuilders(); }
  if(s==='accounts'){ await ai('Picking up at business accounts 👇'); return doAccounts(); }
  if(s==='accounting'){ await ai('Picking up at accounting 👇'); return doAccounting(); }
  if(s==='done'){ return finish(); }
  if((s==='domains'||s==='prices')&&state.domain){ await ai('Let\'s get back to <strong>'+state.domain+'</strong> 👇'); return runDomainPrices(); }
  if(state.idea){ return afterIdeaStep(); }
  askIdea();
}

/* ── Free-text input handler ── */
async function handleInput(text){
  text=text.trim(); if(!text) return;
  document.querySelectorAll('.quick-chips').forEach(function(c){ c.remove(); });

  /* Email capture step */
  if(state.step==='email'){
    if(!isEmail(text)){ user(text); await ai('Hmm, that doesn\'t look like an email. Pop in a valid address so I can save your progress 🙂'); return; }
    user(text);
    state.email=text.trim().toLowerCase();
    var store=loadStore();
    if(store[state.email]&&(store[state.email].idea||store[state.email].domain)){
      saveProgress();
      await ai('Welcome back! Found your saved progress — resuming now ▶');
      return resume();
    }
    saveProgress();
    await ai('Saved! 🔒 You can leave and come back anytime — I\'ll remember where you left off.');
    return afterIdeaStep();
  }

  user(text);

  /* Domain typed directly */
  if(isDomain(text)){
    state.domain=text.toLowerCase();
    await ai('Nice — <strong>'+state.domain+'</strong>! Let me compare prices across registrars 👇');
    logActivity('compared','Compared prices for '+state.domain);
    saveComparison('Domain prices: '+state.domain);
    card(domainPriceTable(state.domain));
    await ai('Cloudflare and Porkbun are the best long-term value — flat renewal pricing, no surprises.');
    addToStack('domain', state.domain, 55);
    showNextDecisions('domain');
    return;
  }

  /* Free-type intent detection (after onboarding) */
  if(state.step !== 'idea'){
    var intent=detectIntent(text);
    if(intent==='domain'){ await ai('Let\'s find you a great domain! Describe your business and I\'ll suggest some names.'); state.step='domains'; return; }
    if(intent==='website'){ await ai('Here\'s how the leading website builders compare 👇'); return doBuilders(); }
    if(intent==='banking'){ await ai('Here\'s how the top business accounts compare 👇'); return doAccounts(); }
    if(intent==='accounting'){ await ai('Here\'s the accounting software comparison 👇'); return doAccounting(); }
  }

  /* Idea capture (first message) */
  if(state.step==='idea'){
    state.idea=text;
    /* Skip email for now — show value first, then ask email at the end */
    return afterIdeaStep();
  }

  /* Domain suggestion step — treat input as a name/idea to suggest from */
  if(state.step==='domains'){
    await ai('Let me find some domain options based on <strong>'+text+'</strong> 👇');
    await showDomainSuggestions(text);
    return;
  }

  /* Fallback */
  await ai('Got it! Here\'s what I can help you with right now:');
  showDecisionGrid();
}

/* ── Wiring ── */
function submit(){ var v=inputEl.value; if(!v.trim()) return; inputEl.value=''; handleInput(v); }
sendBtn.addEventListener('click', submit);
inputEl.addEventListener('keydown', function(e){ if(e.key==='Enter') submit(); });

start();
</script>
</body>
</html>
