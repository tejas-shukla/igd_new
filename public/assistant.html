<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Launch Assistant – Igotdomain</title>
<meta name="description" content="Chat with the Igotdomain AI assistant: get domain name suggestions, compare domain prices across providers, and compare website builders, business accounts and accounting software.">
<meta name="robots" content="index, follow">
<link rel="canonical" href="https://igotdomain.com/assistant">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700;800&family=DM+Sans:ital,wght@0,300;0,400;0,500;0,600;1,300&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<nav aria-label="Main navigation">
  <a href="/" class="nav-logo"><span class="logo-mark">🚀</span>Igot<span>domain</span></a>
  <div class="nav-links">
    <a href="/how-it-works">How It Works</a>
    <a href="/dashboard">Dashboard</a>
    <a href="/assistant" class="active">AI Assistant</a>
    <a href="/blog">Blog</a>
    <a href="/why-us">Why Us</a>
  </div>
  <a href="/dashboard" class="nav-cta">My Dashboard →</a>
</nav>

<main class="assistant-wrap">
  <div class="assistant-shell">
    <div class="assistant-head">
      <div class="chat-avatar">🤖</div>
      <div><div class="chat-name">Igotdomain AI</div><div class="chat-status">● Online · Your launch assistant</div></div>
    </div>
    <div class="assistant-body" id="abody"></div>
    <div class="assistant-input">
      <input type="text" id="ainput" placeholder="Type your business idea or a domain…" autocomplete="off">
      <button id="asend" aria-label="Send">➤</button>
    </div>
  </div>
  <p class="privacy-note" style="margin-top:14px">🔒 Sample comparison data is shown for demonstration. We never sell your data or push sponsored picks. <a href="/why-us" style="color:var(--teal)">Our promise →</a></p>
</main>

<a href="/dashboard" class="float-chat" aria-label="Go to dashboard">
  <span class="float-tooltip">View dashboard 📊</span>
  <span class="float-btn">📊</span>
</a>

<script src="app.js"></script>
<script>
/* ============ Assistant logic (v2) ============ */
const body = document.getElementById('abody');
const input = document.getElementById('ainput');
const sendBtn = document.getElementById('asend');

const STORE_KEY = 'igd_progress';   // map: { email: {idea, domain, step} }
const EMAIL_KEY = 'igd_email';

const STOP = new Set(['a','an','the','for','to','of','and','or','my','i','want','build','create','make','business','startup','company','idea','app','platform','that','helps','help','with','in','on','is','are','be','it','this','website','site']);

let state = { email:'', idea:'', domain:'', step:'idea' };

function loadStore(){ try{ return JSON.parse(localStorage.getItem(STORE_KEY)||'{}'); }catch(e){ return {}; } }
function saveProgress(){
  if(!state.email) return;
  try{
    const all = loadStore();
    all[state.email] = { idea:state.idea, domain:state.domain, step:state.step };
    localStorage.setItem(STORE_KEY, JSON.stringify(all));
    localStorage.setItem(EMAIL_KEY, state.email);
  }catch(e){}
}
function setStep(s){ state.step = s; saveProgress(); }
function markPurchased(){ try{ localStorage.setItem('igd_purchased','1'); }catch(e){} }

function scrollDown(){ body.scrollTop = body.scrollHeight; }

function ai(html, delay=600){
  return new Promise(res=>{
    const tp=document.createElement('div'); tp.className='msg msg-ai';
    tp.innerHTML='<div class="typing"><span></span><span></span><span></span></div>';
    body.appendChild(tp); scrollDown();
    setTimeout(()=>{
      tp.remove();
      const w=document.createElement('div'); w.className='msg msg-ai';
      w.innerHTML='<div class="msg-bubble">'+html+'</div>'; body.appendChild(w); scrollDown(); res();
    }, delay);
  });
}
function user(text){
  const w=document.createElement('div'); w.className='msg msg-user';
  w.innerHTML='<div class="msg-bubble">'+text+'</div>'; body.appendChild(w); scrollDown();
}
function card(innerHTML){
  const c=document.createElement('div'); c.className='acard'; c.innerHTML=innerHTML; body.appendChild(c); scrollDown(); return c;
}
function chips(options, handler){
  const wrap=document.createElement('div'); wrap.className='quick-chips';
  options.forEach(o=>{ const b=document.createElement('button'); b.className='qchip'; b.textContent=o; b.onclick=()=>handler(o,wrap); wrap.appendChild(b); });
  body.appendChild(wrap); scrollDown(); return wrap;
}
function isEmail(t){ return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(t.trim()); }
function isDomain(text){ return /\.[a-z]{2,}$/i.test(text.trim()) && !/\s/.test(text.trim()); }
function keywords(text){ return text.toLowerCase().replace(/[^a-z0-9\s]/g,' ').split(/\s+/).filter(w=>w&&w.length>2&&!STOP.has(w)); }
function capital(s){ return s.charAt(0).toUpperCase()+s.slice(1); }

function suggestDomains(text){
  const kw=keywords(text); const base=(kw[0]||'launch'); const second=kw[1]||'';
  const root=(base+(second?capital(second):'')).slice(0,16);
  const cand=[{name:base+second,ext:'.com'},{name:'get'+capital(base),ext:'.com'},{name:base+'hq',ext:'.com'},
              {name:root.toLowerCase(),ext:'.io'},{name:'try'+capital(base),ext:'.io'},{name:base+(second||'app'),ext:'.ai'}];
  return cand.map((c,i)=>({...c,name:c.name.toLowerCase(),avail:!(i===0)}));
}

/* ---- provider links (open in new tab) ---- */
const LINKS = {
  'Cloudflare':'https://www.cloudflare.com/products/registrar/','Porkbun':'https://porkbun.com/',
  'Namecheap':'https://www.namecheap.com/','GoDaddy':'https://www.godaddy.com/',
  'Shopify':'https://www.shopify.com/','Wix':'https://www.wix.com/','Squarespace':'https://www.squarespace.com/',
  'Webflow':'https://webflow.com/','WordPress.com':'https://wordpress.com/',
  'Mercury':'https://mercury.com/','Wise Business':'https://wise.com/business/','Revolut Business':'https://www.revolut.com/business/',
  'Tide':'https://www.tide.co/','Starling':'https://www.starlingbank.com/business-account/',
  'Wave':'https://www.waveapps.com/','QuickBooks':'https://quickbooks.intuit.com/','Xero':'https://www.xero.com/',
  'FreeAgent':'https://www.freeagent.com/','FreshBooks':'https://www.freshbooks.com/'
};
function provLink(name, label){
  const url=LINKS[name]||'#';
  return '<a href="'+url+'" target="_blank" rel="noopener" onclick="markPurchased()" '+
         'style="color:var(--teal);font-weight:600;text-decoration:none">'+(label||'Visit ↗')+'</a>';
}

/* ---- comparison tables ---- */
function domainPriceTable(domain){
  const ext='.'+domain.split('.').pop();
  const map={
    '.com':[['Cloudflare','☁️','$9.77','$9.77','Free','At-cost, no markup',true],['Porkbun','🐷','$9.13','$11.06','Free','Cheapest first year',false],['Namecheap','🟠','$10.28','$15.88','Free','Free privacy + email',false],['GoDaddy','🟢','$11.99','$21.99','Paid','Add-on heavy upsells',false]],
    '.io':[['Porkbun','🐷','$33.20','$38.00','Free','Best .io renewal',true],['Cloudflare','☁️','$36.00','$36.00','Free','At-cost pricing',false],['Namecheap','🟠','$34.98','$42.88','Free','Free privacy',false],['GoDaddy','🟢','$39.99','$64.99','Paid','Pricey renewal',false]],
    '.ai':[['Porkbun','🐷','$68.62','$68.62','Free','Lowest .ai price',true],['Cloudflare','☁️','$70.00','$70.00','Free','At-cost, no markup',false],['Namecheap','🟠','$74.98','$84.88','Free','2-yr min on some',false],['GoDaddy','🟢','$99.99','$104.99','Paid','Premium markup',false]]
  };
  const rows=map[ext]||map['.com'];
  let html='<div class="acard-title">🌐 Domain price comparison — <span style="color:var(--teal)">'+domain+'</span></div>';
  html+='<div class="acard-note">Sample first-year & renewal pricing — links open in a new tab</div>';
  html+='<div class="cmp-wrap"><table class="cmp"><thead><tr><th>Provider</th><th>1st year</th><th>Renewal</th><th>Privacy</th><th></th></tr></thead><tbody>';
  rows.forEach(r=>{
    html+='<tr class="'+(r[6]?'best':'')+'"><td><span class="prov"><span class="pico">'+r[1]+'</span>'+r[0]+(r[6]?' <span class="pill pill-best">Best value</span>':'')+'</span></td>'+
          '<td class="price">'+r[2]+'</td><td>'+r[3]+'</td>'+
          '<td>'+(r[4]==='Free'?'<span class="pill pill-yes">Free</span>':'<span class="pill pill-mid">Paid</span>')+'</td>'+
          '<td>'+provLink(r[0],'Buy ↗')+'</td></tr>';
  });
  html+='</tbody></table></div>'; return html;
}
const builders=[['Shopify','🛍️','$29/mo','2.9% + 30¢','E-commerce & DTC brands',true],['Wix','🔷','$17/mo','0%','All-purpose small sites',false],['Squarespace','⬛','$16/mo','0%','Designers & creators',false],['Webflow','🌀','$14/mo','0%','Custom, design-led sites',false],['WordPress.com','📝','$4/mo','0%','Blogs & full flexibility',false]];
function buildersTable(){
  let html='<div class="acard-title">🛠️ Website builder comparison</div><div class="acard-note">Sample pricing — links open in a new tab</div>';
  html+='<div class="cmp-wrap"><table class="cmp"><thead><tr><th>Builder</th><th>From</th><th>Fees</th><th>Best for</th><th></th></tr></thead><tbody>';
  builders.forEach(b=>{ html+='<tr class="'+(b[5]?'best':'')+'"><td><span class="prov"><span class="pico">'+b[1]+'</span>'+b[0]+(b[5]?' <span class="pill pill-best">Popular</span>':'')+'</span></td><td class="price">'+b[2]+'</td><td>'+b[3]+'</td><td>'+b[4]+'</td><td>'+provLink(b[0],'Visit ↗')+'</td></tr>'; });
  html+='</tbody></table></div>'; return html;
}
const accounts=[['Mercury','🏦','$0/mo','Free','Tech startups (US)',true],['Wise Business','💸','$0','Low FX','Multi-currency',false],['Revolut Business','⚡','$0–$25/mo','Multi-FX','Global teams',false],['Tide','🌊','£0/mo','Pay-as-you-go','UK sole traders',false],['Starling','⭐','£0/mo','Free UK transfers','UK SMEs',false]];
function accountsTable(){
  let html='<div class="acard-title">🏦 Business account comparison</div><div class="acard-note">Sample data — availability varies by country, links open in a new tab</div>';
  html+='<div class="cmp-wrap"><table class="cmp"><thead><tr><th>Provider</th><th>Fee</th><th>Transfers/FX</th><th>Best for</th><th></th></tr></thead><tbody>';
  accounts.forEach(a=>{ html+='<tr class="'+(a[5]?'best':'')+'"><td><span class="prov"><span class="pico">'+a[1]+'</span>'+a[0]+(a[5]?' <span class="pill pill-best">Top pick</span>':'')+'</span></td><td class="price">'+a[2]+'</td><td>'+a[3]+'</td><td>'+a[4]+'</td><td>'+provLink(a[0],'Open ↗')+'</td></tr>'; });
  html+='</tbody></table></div>'; return html;
}
const accounting=[['Wave','🌊','Free','Invoicing & accounting','Solo founders',true],['QuickBooks','📗','$19/mo','Full accounting + payroll','Small business standard',false],['Xero','🔵','$20/mo','Unlimited users','Growing teams',false],['FreeAgent','🟣','$13/mo','UK tax & self-assessment','UK freelancers',false],['FreshBooks','🟢','$17/mo','Best-in-class invoicing','Service businesses',false]];
function accountingTable(){
  let html='<div class="acard-title">📒 Accounting software comparison</div><div class="acard-note">Sample pricing — links open in a new tab</div>';
  html+='<div class="cmp-wrap"><table class="cmp"><thead><tr><th>Software</th><th>From</th><th>Strength</th><th>Best for</th><th></th></tr></thead><tbody>';
  accounting.forEach(a=>{ html+='<tr class="'+(a[5]?'best':'')+'"><td><span class="prov"><span class="pico">'+a[1]+'</span>'+a[0]+(a[5]?' <span class="pill pill-best">Free pick</span>':'')+'</span></td><td class="price">'+a[2]+'</td><td>'+a[3]+'</td><td>'+a[4]+'</td><td>'+provLink(a[0],'Visit ↗')+'</td></tr>'; });
  html+='</tbody></table></div>'; return html;
}

/* ---- step navigation with skip ---- */
function stepNav(prompt, label, fn){
  const c=card('<div style="font-size:14px;color:var(--gray-600)">'+prompt+'</div>');
  const act=document.createElement('div'); act.className='acard-actions';
  const b=document.createElement('button'); b.className='next-btn'; b.textContent=label;
  b.onclick=()=>{ act.remove(); user(label.replace(/ →$/,'')); fn(); };
  const skip=document.createElement('button'); skip.className='next-btn ghost'; skip.textContent='Skip this →';
  skip.onclick=()=>{ act.remove(); user('Skip this'); fn(true); };
  act.appendChild(b); act.appendChild(skip); c.appendChild(act); scrollDown();
}

/* ============ FLOW ============ */
async function start(){
  let savedEmail=''; try{ savedEmail=localStorage.getItem(EMAIL_KEY)||''; }catch(e){}
  const store=loadStore();
  if(savedEmail && store[savedEmail]){
    state.email=savedEmail; state.idea=store[savedEmail].idea||''; state.domain=store[savedEmail].domain||'';
    await ai("Welcome back, <strong>"+savedEmail+"</strong> 👋");
    await ai("I've still got your progress saved"+(state.idea?(" — your idea was <strong>"+state.idea+"</strong>"):"")+". Want to pick up where you left off, or start fresh?");
    const wrap=document.createElement('div'); wrap.className='quick-chips';
    const cont=document.createElement('button'); cont.className='qchip'; cont.textContent='▶ Continue where I left off';
    cont.onclick=()=>{ wrap.remove(); user('Continue where I left off'); resume(); };
    const fresh=document.createElement('button'); fresh.className='qchip'; fresh.textContent='↻ Start fresh';
    fresh.onclick=()=>{ wrap.remove(); user('Start fresh'); state.idea='';state.domain='';state.step='idea'; askIdea(); };
    body.appendChild(wrap); scrollDown();
    return;
  }
  await ai("Hi! I'm your Igotdomain launch assistant. 🚀");
  askIdea();
}

async function resume(){
  const s=state.step;
  if(s==='builders'){ await ai("Picking up at website builders 👇"); return runBuilders(); }
  if(s==='accounts'){ await ai("Picking up at business accounts 👇"); return runAccounts(); }
  if(s==='accounting'){ await ai("Picking up at accounting software 👇"); return runAccounting(); }
  if(s==='done'){ return finish(); }
  if((s==='domains'||s==='prices') && state.domain){ await ai("Let's get back to <strong>"+state.domain+"</strong> 👇"); return runDomainPrices(); }
  if(state.idea){ return afterIdea(state.idea, true); }
  askIdea();
}

async function askIdea(){
  setStep('idea');
  await ai("Tell me your <strong>business idea</strong>, or type a <strong>domain</strong> you already have in mind.");
  chips(['SaaS for project management','Coffee subscription box','Freelance design agency','Online fitness coaching'],(val,wrap)=>{ wrap.remove(); handleInput(val); });
}

async function handleInput(text){
  text=text.trim(); if(!text) return;
  document.querySelectorAll('.quick-chips').forEach(c=>c.remove());

  // email step
  if(state.step==='email'){
    if(!isEmail(text)){ user(text); await ai("Hmm, that doesn't look like an email. Pop in a valid address so I can save your progress 🙂"); return; }
    user(text);
    state.email=text.trim().toLowerCase();
    const store=loadStore();
    if(store[state.email] && (store[state.email].idea||store[state.email].domain)){
      saveProgress();
      await ai("Welcome back! I found saved progress for <strong>"+state.email+"</strong> — resuming now ▶");
      return resume();
    }
    saveProgress();
    await ai("Saved! 🔒 You can leave and come back anytime with this email and continue right where you left off.");
    return afterIdea(state.idea);
  }

  user(text);
  if(isDomain(text)){
    state.domain=text.toLowerCase(); state.idea=state.idea||text.toLowerCase();
    await ai("Nice — <strong>"+state.domain+"</strong>! First, let me save your spot so you don't lose progress.");
    return askEmail();
  }
  // it's an idea
  state.idea=text;
  await ai("Love it. 💡 Before we dive in, let me save your progress.");
  return askEmail();
}

async function askEmail(){
  setStep('email');
  await ai("What's your <strong>email address</strong>? I'll use it only to save your progress so you can start where you left off — never spam, never sold.");
}

async function afterIdea(text, silent){
  if(state.domain){ return runDomainPrices(); }
  setStep('domains');
  if(!silent) await ai("Now let's find you a great domain. 🔍");
  const sugg=suggestDomains(text);
  const c=card('<div class="acard-title">🌐 Domain suggestions</div><div class="acard-note">Pick one to compare prices across providers</div>');
  const list=document.createElement('div'); list.className='domain-suggest';
  sugg.forEach(s=>{
    const row=document.createElement('div'); row.className='dsug';
    row.innerHTML='<span class="dn">'+s.name+'<span class="domain-ext">'+s.ext+'</span></span>'+(s.avail?'<span class="pill pill-yes">Available</span>':'<span class="pill pill-no">Taken</span>');
    if(s.avail){ row.onclick=()=>pickDomain(s.name+s.ext,c); } else { row.style.opacity='0.55'; row.style.cursor='not-allowed'; }
    list.appendChild(row);
  });
  c.appendChild(list);
  const act=document.createElement('div'); act.className='acard-actions';
  const skip=document.createElement('button'); skip.className='next-btn ghost'; skip.textContent='I already have a domain — skip →';
  skip.onclick=()=>{ user('I already have a domain'); runBuilders(); };
  act.appendChild(skip); c.appendChild(act); scrollDown();
}

async function pickDomain(domain, cardEl){
  state.domain=domain;
  cardEl.querySelectorAll('.dsug').forEach(d=>d.style.pointerEvents='none');
  user("Let's go with "+domain);
  await ai("Excellent choice! Here's how <strong>"+domain+"</strong> is priced across registrars 👇");
  runDomainPrices();
}

async function runDomainPrices(){
  setStep('prices');
  card(domainPriceTable(state.domain||'yourbusiness.com'));
  await ai("Cheapest isn't always best — Cloudflare and Porkbun never mark up renewals, while some registrars hike year two.");
  setStep('builders');
  stepNav("Next, let's pick where you'll build your site.","Compare website builders →",runBuilders);
}
async function runBuilders(skip){
  setStep('builders');
  if(!skip){ await ai("Here's how the leading website builders stack up 👇"); card(buildersTable());
    await ai("Selling products? Shopify is the safe default. Content or marketing site? Webflow or WordPress give more control for less."); }
  setStep('accounts');
  stepNav("Now the money side — where will you hold your business funds?","Compare business accounts →",runAccounts);
}
async function runAccounts(skip){
  setStep('accounts');
  if(!skip){ await ai("A dedicated business account keeps your finances clean from day one 👇"); card(accountsTable());
    await ai("Tip: open this before your first sale so every transaction is cleanly separated for tax time."); }
  setStep('accounting');
  stepNav("Last piece — keeping your books in order.","Compare accounting software →",runAccounting);
}
async function runAccounting(skip){
  setStep('accounting');
  if(!skip){ await ai("And finally, accounting software so tax season is painless 👇"); card(accountingTable());
    await ai("Wave is free and perfect to start. Graduate to QuickBooks or Xero as you grow."); }
  finish();
}
async function finish(){
  setStep('done');
  await ai("🎉 That's your launch stack: <strong>domain → website → bank → books</strong>. Want to track it all and unlock your free Founder Launch Pack?");
  const c=card('<div class="acard-title">🚀 You\'re ready to launch</div><div class="acard-note">Your Business Launch Score just hit 25% — Business Planning ✓</div>');
  const act=document.createElement('div'); act.className='acard-actions';
  act.innerHTML='<a class="next-btn" href="/dashboard">Open my dashboard →</a><a class="next-btn ghost" href="/how-it-works">See full roadmap</a>';
  c.appendChild(act); scrollDown();
}

function submit(){ const v=input.value; if(!v.trim()) return; input.value=''; handleInput(v); }
sendBtn.addEventListener('click', submit);
input.addEventListener('keydown', e=>{ if(e.key==='Enter') submit(); });

start();
</script>
</body>
</html>
